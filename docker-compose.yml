# Local test environment — Postgres only (added 31 Aug 2026).
# The API/apps run on the host (npm run dev); this just provides the database
# the .env.example DATABASE_URL already points at:
#   postgresql://postgres:postgres@localhost:5432/fitness_ai_app
#
# Usage:
#   docker compose up -d        # start Postgres
#   docker compose down         # stop (keeps data volume)
#   docker compose down -v      # stop and wipe the database
services:
  db:
    image: postgres:16-alpine
    container_name: primefit-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fitness_ai_app
    ports:
      - "5432:5432"
    volumes:
      - primefit_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fitness_ai_app"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  primefit_pgdata:
