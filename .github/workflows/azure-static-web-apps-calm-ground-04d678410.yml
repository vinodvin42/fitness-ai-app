name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
      # Go-live hardening (3 Sep 2026) — same npm-workspaces build issue and
      # the same MSYS-mangled app_location fix as admin-web's identical
      # workflow — see that file's comment and AZURE-DEPLOY-RUNBOOK.md step
      # 5 for the full writeup. EXPO_PUBLIC_API_BASE_URL (not
      # VITE_API_BASE_URL) is what actually gets inlined into the exported
      # web bundle, confirmed against apps/user-mobile's src/api/client.ts
      # and mirrored in apps/coach-mobile's (4 Sep 2026 fix — it only read
      # a static app.json field before that).
      #
      # 4 Sep 2026 — this now builds apps/coach-mobile, not apps/user-mobile
      # as it did for the first few hours of this file's existence.
      # Explicit product decision, not a guess: regular users install the
      # real mobile app from the landing page's download section (Android
      # APK); only coaches get a web login. This job's name/workflow
      # filename still says "calm-ground" (its original auto-generated
      # identity tied to this Static Web App resource) — harmless,
      # cosmetic, not worth renaming and re-linking a resource over.
      #
      # 4 Sep 2026, later the same day — this site briefly also served
      # apps/landing merged at its root (same reasoning as admin-web's
      # identical merge step now has); moved to admin-web's site instead
      # per explicit direction, so this reverted to serving just
      # coach-mobile standalone, directly at its own root — no /app/
      # prefix needed once there's no landing page competing for the root.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build:coach
        env:
          EXPO_PUBLIC_API_BASE_URL: ${{ secrets.API_BASE_URL }}
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_CALM_GROUND_04D678410 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          skip_app_build: true # already built above — see the comment on this job's build step
          app_location: "apps/coach-mobile/dist" # the already-built output, not the source folder
          api_location: "" # Api source code path - optional
          output_location: "" # left blank — app_location above already points at the built output
          ###### End of Repository/Build Configurations ######

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_CALM_GROUND_04D678410 }}
          action: "close"
