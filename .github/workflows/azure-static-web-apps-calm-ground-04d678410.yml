name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
      # Go-live hardening (3 Sep 2026) — same npm-workspaces build issue and
      # the same MSYS-mangled app_location fix as admin-web's identical
      # workflow — see that file's comment and AZURE-DEPLOY-RUNBOOK.md step
      # 5 for the full writeup. `build:mobile` is the root-level script
      # (`expo export --platform web`) — see root package.json —
      # and EXPO_PUBLIC_API_BASE_URL (not VITE_API_BASE_URL) is what
      # actually gets inlined into the exported web bundle, confirmed
      # against src/api/client.ts.
      #
      # 4 Sep 2026 — this site now also serves apps/landing at its root,
      # merged with this app under /app/, per scripts/merge-web-deploy.js's
      # own top comment for the full reasoning (why the two don't collide,
      # why only index.html needs to move). primefit-landing's own
      # standalone Static Web App is being decommissioned in favor of this
      # single, unified site — a visitor lands on the marketing page first
      # and reaches this real app via its "Log In" link.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build:mobile
        env:
          EXPO_PUBLIC_API_BASE_URL: ${{ secrets.API_BASE_URL }}
      - run: node scripts/merge-web-deploy.js combined-web-deploy
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_CALM_GROUND_04D678410 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          skip_app_build: true # already built above — see the comment on this job's build step
          app_location: "combined-web-deploy" # landing (root) + this app (under /app/) merged by scripts/merge-web-deploy.js
          api_location: "" # Api source code path - optional
          output_location: "" # left blank — app_location above already points at the built output
          ###### End of Repository/Build Configurations ######

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_CALM_GROUND_04D678410 }}
          action: "close"
