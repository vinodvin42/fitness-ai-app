name: Build Android APK (EAS)

# NOTE (6 Nov 2026): this builds on EAS's cloud, which is metered — run
# 18 failed with "This account has used its Android builds from the Free
# plan this month". android-build-local.yml does the same job on the
# GitHub runner with Gradle and no EAS build service, which is what the
# owner asked for. Prefer that one. This is kept because it still works
# whenever cloud build quota is available, and because it is the only
# path that uses EAS's stored signing key directly rather than a
# keystore exported into repository secrets.
#
# Builds apps/user-mobile into an installable Android APK on Expo's
# infrastructure, so the artifact the landing page links to can be
# produced without anyone's laptop being the release machine.
#
# Until this existed, every APK was built by hand and the only record of
# it was a comment in apps/landing/download.html. That is why the
# download link sat on the 22 Sep build through an entire R1 release:
# the code shipped to main, and nothing carried it into a binary.
#
# Started by hand (workflow_dispatch) or by pushing an android-build-*
# tag, never by an ordinary push to main: every run consumes EAS build
# minutes and signs an artifact with the project's real Android keystore,
# so it stays a deliberate act. The tag trigger (17 Oct 2026) exists so a
# build can be started from a terminal with only git access; tag runs use
# the `preview` profile.
#
# What is and is not verified here: the shell in the reporting step was
# tested directly — the jq extraction against both shapes eas returns,
# and the artifact check against a real large zip, an HTML error page
# served with a 200, an undersized zip and a 404, each landing on the
# right branch. The `eas build` step itself has never run: it needs an
# Expo account, and the environment this was written in has neither
# credentials nor network access to expo.dev. Treat the first dispatch
# as the real test of that step.
#
# REQUIRES the EXPO_TOKEN repository secret — an Expo access token from
# https://expo.dev/settings/access-tokens for the account that owns the
# project (app.json's `owner`, currently vinodvin42). Without it this
# workflow fails on its first step, by design; see "Why not a login
# step" below.

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "eas.json build profile (only `preview` is defined today)"
        required: true
        default: preview
  push:
    tags:
      - "android-build-*"

permissions:
  # write, so the validated APK can be attached to a GitHub Release. The
  # release is the durable copy — see the publish step at the end.
  contents: write

concurrency:
  # Same reasoning as deploy-azure-api.yml's: a second dispatch should
  # queue behind a running build, not race it. Cancelling mid-build
  # wastes the minutes already spent and leaves a half-finished build on
  # the Expo side.
  group: eas-build-android
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # eas-cli installed directly rather than through
      # expo/expo-github-action. The action is the more common recipe,
      # but pinning a third-party action to a version this repo cannot
      # verify is how a workflow ships broken. `EXPO_TOKEN` in the
      # environment is EAS's own documented non-interactive auth and
      # needs nothing else.
      - name: Install eas-cli
        run: npm install -g eas-cli

      # Fails fast and says why. Without a token eas-cli tries to prompt
      # for a login, finds no TTY, and the job either hangs to its
      # timeout or dies with a message about interactivity that says
      # nothing about the missing secret.
      - name: Check the EXPO_TOKEN secret is set
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::The EXPO_TOKEN repository secret is not set. Create an access token at https://expo.dev/settings/access-tokens for the account that owns this project (app.json 'owner'), then add it under Settings -> Secrets and variables -> Actions." >&2
            exit 1
          fi

      - name: Build
        working-directory: apps/user-mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas build \
            --platform android \
            --profile "${{ inputs.profile || 'preview' }}" \
            --non-interactive \
            --wait \
            --json > "$RUNNER_TEMP/build.json"

      # The last build's provenance lived in an HTML comment someone
      # wrote by hand. This prints the same facts — artifact URL, real
      # byte size, versionCode — into the run summary, so updating
      # apps/landing/download.html is transcription rather than
      # archaeology.
      - name: Report the artifact
        run: |
          json="$RUNNER_TEMP/build.json"

          # The raw payload goes to the log unconditionally: the key path
          # below is the current shape of `eas build --json`, and if a
          # future eas-cli moves it, the answer must still be in the log
          # rather than lost to a jq expression that quietly returned
          # nothing.
          echo "--- raw eas build --json output ---"
          cat "$json"
          echo "-----------------------------------"

          url=$(jq -r '
            [ .[]?.artifacts?.applicationArchiveUrl?,
              .[]?.artifacts?.buildUrl?,
              .artifacts?.applicationArchiveUrl?,
              .artifacts?.buildUrl? ]
            | map(select(. != null and . != "")) | first // empty
          ' "$json")

          if [ -z "$url" ]; then
            echo "::error::The build finished but no artifact URL was found in its JSON. The raw payload is printed above." >&2
            exit 1
          fi

          version=$(jq -r '[ .[]?.appVersion?, .appVersion? ] | map(select(. != null)) | first // "unknown"' "$json")
          code=$(jq -r '[ .[]?.appBuildVersion?, .appBuildVersion? ] | map(select(. != null)) | first // "unknown"' "$json")

          # Handed to the publish step below, which runs in its own shell
          # and cannot see these variables. "unknown" would make a tag
          # that collides with the next unknown build, so refuse instead.
          if [ "$version" = "unknown" ] || [ "$code" = "unknown" ]; then
            echo "::error::Could not read appVersion/appBuildVersion from the build JSON above, so the release tag would be ambiguous." >&2
            exit 1
          fi
          printf '%s' "$version" > "$RUNNER_TEMP/version"
          printf '%s' "$code" > "$RUNNER_TEMP/code"

          # Download the artifact rather than reading Content-Length from a
          # HEAD. Two reasons, both found by testing this logic rather than
          # assuming it: a HEAD can come back with no Content-Length at all
          # (HTTP/2, chunked), and an empty length made the size arithmetic
          # below silently produce "~0MB" — which would have been written
          # straight into the download page's visible copy. Pulling the file
          # also proves the whole download works, which is what the previous
          # release checked by hand before wiring its link in.
          apk="$RUNNER_TEMP/app.apk"
          status=$(curl -sSL --max-time 900 -w '%{http_code}' -o "$apk" "$url")

          if [ "$status" != "200" ]; then
            echo "::error::The artifact URL answered HTTP $status, not 200: $url" >&2
            exit 1
          fi

          # Shared with publish-apk-release.yml, so the two publishers
          # cannot drift apart on what counts as a valid APK.
          bytes=$(scripts/validate-apk.sh "$apk")


          mb=$(( (bytes + 524288) / 1048576 ))

          # Also to stdout, not only the run summary. The summary is
          # visible in the Actions UI but absent from the job log, so the
          # first real build reported a size that could not be read back
          # through the logs API when it came time to update the
          # download page.
          echo "artifact:    $url"
          echo "version:     $version"
          echo "versionCode: $code"
          echo "size:        $bytes bytes / ~${mb}MB"

          {
            echo "## Android APK"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Artifact | \`$url\` |"
            echo "| Version | $version |"
            echo "| versionCode | $code |"
            echo "| Size | $bytes bytes / ~${mb}MB |"
            echo "| Commit | \`$GITHUB_SHA\` |"
            echo
            echo "To publish it, update \`apps/landing/download.html\`:"
            echo
            echo "1. the Android card's \`href\` → the artifact URL above"
            echo "2. the visible size copy → \`~${mb}MB\`"
            echo "3. the provenance comment above the card → this version, versionCode, date and commit"
            echo "4. regenerate \`apps/landing/assets/i18n/en.js\` — the size string is a translated key, and"
            echo "   \`apps/api/tests/landingI18n.test.ts\` fails if the catalogue and the page disagree"
            echo
            echo "Then merge to main, which redeploys the landing site."
          } >> "$GITHUB_STEP_SUMMARY"

      # Why a GitHub Release, and why the site serves it rather than
      # linking here.
      #
      # An EAS internal-distribution artifact lives 14 days. The download
      # page has linked one four times now and gone dead twice — on
      # 6 Oct and again on 17 Oct — because nobody was watching a clock
      # nobody could see. Rebuilding to refresh the URL is also not free:
      # run 18 failed outright with "This account has used its Android
      # builds from the Free plan this month", so a fortnightly rebuild
      # spends a scarce monthly quota on a link, not on a release.
      #
      # A Release asset does not expire. This repository is private, so
      # a visitor cannot fetch that asset directly — which is fine,
      # because they are never given its URL. The release is the durable
      # STORE; the Static Web App is the public DISTRIBUTION. The site
      # deploy pulls this asset with its own token and serves it from
      # /downloads/fynrox-android.apk, a path that never changes again.
      #
      # The tag carries the versionCode, so every build keeps its own
      # release and a bad one can be rolled back by re-pointing the
      # `android-latest` tag rather than rebuilding.
      - name: Publish the APK to a GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The asset NAME is the file's basename; the "#label" suffix
          # below only sets a display label. The first run of this proved
          # it — the asset uploaded as "app.apk" with the label right,
          # and the read-back, which looks up the name the site deploy
          # will use, correctly refused it.
          apk="$RUNNER_TEMP/fynrox-android.apk"
          cp "$RUNNER_TEMP/app.apk" "$apk"
          version=$(cat "$RUNNER_TEMP/version")
          code=$(cat "$RUNNER_TEMP/code")
          tag="android-v${version}-${code}"

          # Idempotent: re-running a build for the same versionCode
          # replaces the asset rather than failing on a tag that exists.
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $tag exists; replacing its asset"
            gh release upload "$tag" "$apk" \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" "$apk" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Android $version (versionCode $code)" \
              --notes "Built from \`$GITHUB_SHA\` by run $GITHUB_RUN_NUMBER of this workflow. $(wc -c < "$apk") bytes. Served publicly at /downloads/fynrox-android.apk by the Static Web App; this asset is the durable copy and is not linked directly." \
              --latest
          fi

          # Read it back. A release that exists with no asset on it would
          # fail the site deploy later, a long way from here.
          size=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[] | select(.name=="fynrox-android.apk") | .size')
          if [ -z "$size" ] || [ "$size" -lt 10000000 ]; then
            echo "::error::fynrox-android.apk is missing from release $tag, or is only ${size:-0} bytes." >&2
            exit 1
          fi
                    # Transitional: an earlier version of these workflows uploaded
          # the binary under its temp-file basename, because gh's
          # "<path>#<label>" suffix sets the asset's label and not its
          # name. Any release still carrying that stray has ~90MB of
          # duplicate on it, and a second asset invites someone to link
          # the wrong one by hand. Remove it where it exists; this is a
          # no-op on every release published since the fix, and can go
          # once none are left.
          stray=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[] | select(.name=="app.apk") | .name')
          if [ -n "$stray" ]; then
            echo "removing the legacy asset app.apk from $tag"
            gh release delete-asset "$tag" app.apk --repo "$GITHUB_REPOSITORY" --yes
          fi

          echo "published $tag with fynrox-android.apk ($size bytes)"

          {
            echo
            echo "Published as release **$tag**, asset \`fynrox-android.apk\` ($size bytes)."
            echo
            echo "The download page does not need editing for the link: it points at"
            echo "\`/downloads/fynrox-android.apk\`, and the next site deploy picks this up."
          } >> "$GITHUB_STEP_SUMMARY"
