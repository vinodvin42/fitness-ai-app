name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
      # Go-live hardening (3 Sep 2026) — Azure Static Web Apps' own default
      # build (via Oryx, auto-detected from app_location) doesn't understand
      # npm workspaces monorepos: it tries to `npm install`/build from
      # inside apps/admin-web alone, which can't resolve the hoisted
      # root-level node_modules or the sibling @fitness-ai-app/types
      # workspace dependency. Building here instead and handing the action
      # the finished output (skip_app_build below) sidesteps that entirely
      # — see AZURE-DEPLOY-RUNBOOK.md step 5 for the full writeup. Also
      # fixes app_location below, which Azure's own CLI wrote as an
      # absolute Windows path ("C:/Program Files/Git/apps/admin-web") due
      # to a Git-Bash/MSYS path-mangling artifact on the machine that ran
      # `az staticwebapp create` — never a valid path on this ubuntu-latest
      # runner.
      #
      # 4 Sep 2026, later the same day — this site now also serves
      # apps/landing at its root, merged with admin-web under /app/, per
      # scripts/merge-web-deploy.js's own top comment for the full
      # reasoning. Explicit direction: landing had been merged with
      # apps/coach-mobile's site instead for a few hours; moved here so
      # landing doesn't get its own separate hosting, on this site instead
      # of that one. The coach-mobile site (calm-ground-04d678410) reverted
      # to serving just that app standalone — see that workflow's own
      # comment. Admin login is reachable from the landing page's own
      # "Admin Login" link.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build --workspace=apps/admin-web
        env:
          VITE_API_BASE_URL: ${{ secrets.API_BASE_URL }}
      - run: node scripts/merge-web-deploy.js combined-web-deploy apps/admin-web/dist
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_PURPLE_SEA_0EDCDC910 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          skip_app_build: true # already built above — see the comment on this job's build step
          app_location: "combined-web-deploy" # landing (root) + admin-web (under /app/) merged by scripts/merge-web-deploy.js
          api_location: "" # Api source code path - optional
          output_location: "" # left blank — app_location above already points at the built output
          ###### End of Repository/Build Configurations ######

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_PURPLE_SEA_0EDCDC910 }}
          action: "close"
