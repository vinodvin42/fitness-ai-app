name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
      # Go-live hardening (3 Sep 2026) — Azure Static Web Apps' own default
      # build (via Oryx, auto-detected from app_location) doesn't understand
      # npm workspaces monorepos: it tries to `npm install`/build from
      # inside apps/admin-web alone, which can't resolve the hoisted
      # root-level node_modules or the sibling @fitness-ai-app/types
      # workspace dependency. Building here instead and handing the action
      # the finished output (skip_app_build below) sidesteps that entirely
      # — see AZURE-DEPLOY-RUNBOOK.md step 5 for the full writeup. Also
      # fixes app_location below, which Azure's own CLI wrote as an
      # absolute Windows path ("C:/Program Files/Git/apps/admin-web") due
      # to a Git-Bash/MSYS path-mangling artifact on the machine that ran
      # `az staticwebapp create` — never a valid path on this ubuntu-latest
      # runner.
      #
      # 4 Sep 2026, later the same day — this site now also serves
      # apps/landing at its root, merged with admin-web under /app/, per
      # scripts/merge-web-deploy.js's own top comment for the full
      # reasoning. Explicit direction: landing had been merged with
      # apps/coach-mobile's site instead for a few hours; moved here so
      # landing doesn't get its own separate hosting, on this site instead
      # of that one. The coach-mobile site (calm-ground-04d678410) reverted
      # to serving just that app standalone — see that workflow's own
      # comment. Admin login is reachable from the landing page's own
      # "Admin Login" link.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build --workspace=apps/admin-web
        env:
          VITE_API_BASE_URL: ${{ secrets.API_BASE_URL }}

      # Gym Partner and Creator portals (21 Sep 2026). They land on this same
      # site rather than getting their own Static Web Apps, which keeps them
      # on an origin the API's CORS_ORIGINS already allows — a separate host
      # per portal would have needed an app-settings change on the API for
      # each one.
      #
      # The mount paths are not a free choice: apps/landing's gyms.html and
      # creators.html already link to /portal/gym/login and
      # /portal/creator/login, so anything else would leave the marketing
      # site's own CTAs pointing at a 404.
      #
      # PORTAL_BASE is the bare path, no leading or trailing slash — see each
      # portal's vite.config.ts for why it is an env var in that shape rather
      # than `vite build --base=...`.
      - run: npm run build --workspace=apps/gym-portal
        env:
          VITE_API_BASE_URL: ${{ secrets.API_BASE_URL }}
          PORTAL_BASE: portal/gym
      - run: npm run build --workspace=apps/creator-portal
        env:
          VITE_API_BASE_URL: ${{ secrets.API_BASE_URL }}
          PORTAL_BASE: portal/creator

      - run: >-
          node scripts/merge-web-deploy.js combined-web-deploy
          apps/admin-web/dist
          apps/gym-portal/dist:portal/gym
          apps/creator-portal/dist:portal/creator
      # apps/landing has no build step, so unlike admin-web and the two
      # portals (which get VITE_API_BASE_URL compiled in above) there is
      # nothing to inject an API origin into its static HTML. Without
      # this step its scripts fall back to a same-origin "/api", which
      # this Static Web App has no route for and no linked backend to
      # serve — so every form on the marketing site and both invite
      # landings post into a 404. See apps/landing/assets/js/config.js.
      #
      # Fails the build on an empty secret rather than deploying a
      # public site whose forms silently point at localhost. A broken
      # deploy is recoverable in minutes; a live site quietly dropping
      # partner applications is not.
      - name: Point the landing site at the real API
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: |
          if [ -z "$API_BASE_URL" ]; then
            echo "::error::The API_BASE_URL secret is empty. apps/landing would ship with its localhost development default and every form on the site would fail." >&2
            exit 1
          fi

          target=combined-web-deploy/assets/js/config.js
          if [ ! -f "$target" ]; then
            echo "::error::$target is missing. apps/landing/assets/js/config.js should have been copied by merge-web-deploy.js — check that it still exists and is not in that script's skip list." >&2
            exit 1
          fi

          base=${API_BASE_URL%/}
          cat > "$target" <<EOF
          /* GENERATED at deploy time from the API_BASE_URL secret.
             The committed version of this file carries the localhost
             development default; see apps/landing/assets/js/config.js. */
          window.FYNROX_API_BASE_URL = "$base";
          EOF

          # Prove the substitution happened, rather than trusting it.
          if grep -q 'localhost' "$target"; then
            echo "::error::$target still mentions localhost after rewriting." >&2
            exit 1
          fi
          echo "landing API base set to $base"
          cat "$target"

      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_PURPLE_SEA_0EDCDC910 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          skip_app_build: true # already built above — see the comment on this job's build step
          app_location: "combined-web-deploy" # landing (root) + admin-web (under /app/) merged by scripts/merge-web-deploy.js
          api_location: "" # Api source code path - optional
          output_location: "" # left blank — app_location above already points at the built output
          ###### End of Repository/Build Configurations ######

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_PURPLE_SEA_0EDCDC910 }}
          action: "close"
